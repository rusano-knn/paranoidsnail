<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ParanoidSnail mascot">
  <title>ParanoidSnail</title>

  <!-- ground shadow -->
  <ellipse cx="32" cy="56" rx="22" ry="4" fill="#000" opacity="0.08" />

  <!-- body (flat sweep left to right, tail on left, head on right) -->
  <path
    d="M 8 46
       Q 6 30 18 26
       L 42 20
       Q 50 19 51 25
       Q 52 34 50 40
       Q 49 46 44 48
       L 22 50
       Q 12 50 8 46 Z"
    fill="#3f9b5e"
  />

  <!-- side duller patch -->
  <path d="M 22 50 Q 12 50 8 46 L 20 40 Z" fill="#2f7a48" />

  <!-- shell: spiral coil on the back -->
  <circle cx="30" cy="30" r="13" fill="#2f7a48" />
  <circle cx="30" cy="31" r="13" fill="#58c07a" fill-opacity="0.25" />
  <path
    d="M 30 31
       C 33 31 33 27 30 27
       C 26 27 26 33 31 34
       C 36 35 36 27 29 26
       C 21 25 20 36 30 38
       C 41 40 41 24 29 21
       C 15 18 16 45 31 45
       C 48 45 46 16 30 13"
    fill="none"
    stroke="#14301d"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.7"
  />
  <!-- shell highlight -->
  <path d="M 26 22 a 6 6 0 0 1 4 -2" fill="none" stroke="#bee6cc" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />

  <!-- head + eyestalks (front-eyestalk is the snail's signature) -->
  <path d="M 44 40 l 4 -6 q 2 -3 5 -2" fill="none" stroke="#2f7a48" stroke-width="3" stroke-linecap="round" />
  <circle cx="53" cy="31" r="4" fill="#3f9b5e" />
  <circle cx="53" cy="31" r="1.7" fill="#0d0f14" />

  <path d="M 47 41 l 3 -7 q 1 -3 4 -4" fill="none" stroke="#2f7a48" stroke-width="3" stroke-linecap="round" />
  <circle cx="55" cy="29" r="3.6" fill="#3f9b5e" />
  <circle cx="55" cy="29" r="1.5" fill="#0d0f14" />

  <!-- tinfoil hat (cone) on the head between the eyestalks -->
  <path d="M 46 34 L 50 20 L 55 32 Q 50 36 46 34 Z" fill="#c0c6cf" />
  <path d="M 50 20 L 46 34 M 50 20 L 55 32" fill="none" stroke="#9aa0aa" stroke-width="1" opacity="0.7" />
</svg>
